[package]
name = "swiftcord-core"
description = "Platform-independent Discord client: REST, gateway, state cache, markdown, permissions"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
futures-util.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
sha2 = "0.10"
unicode-segmentation = "1"

# QR login's RSA key: Windows' CNG there, the rsa crate elsewhere.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(not(windows))'.dependencies]
rsa = "0.9"
