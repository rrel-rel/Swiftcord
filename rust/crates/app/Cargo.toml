[package]
name = "swiftcord"
description = "A lightweight native Discord client for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
swiftcord-core.workspace = true
swiftcord-voice.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
# The window and its input; drawing is our own, with Direct3D 11 (src/platform/d3d11.rs).
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
qrcode = { version = "0.14", default-features = false }
# Lottie stickers: velato reads the animation, and the CPU renderer egui already uses draws it.
velato = { version = "0.12", default-features = false }
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline"] }
rfd = "0.17"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "6"
memmap2 = "0.9"
tauri-winrt-notification = "0.8"
wry = "0.57"
# The captcha window answers a discord.com request itself, which needs WebView2 directly (same version as wry's).
webview2-com = "0.39"
tao = "0.37"

windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_MediaFoundation", "Win32_UI_Shell", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(windows)'.build-dependencies]
# The exe's icon and version details (shown in Explorer and the taskbar).
winresource = "0.1"
# Compiles the renderer's shaders with Windows' D3DCompile.
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc"] }
