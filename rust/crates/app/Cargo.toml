[package]
name = "swiftcord"
description = "A lightweight native Discord client for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
swiftcord-core.workspace = true
swiftcord-voice.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# wgpu renders through Direct3D 12, which every Windows 11 device (ARM64 included) has; OpenGL isn't a given on ARM.
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
qrcode = { version = "0.14", default-features = false }
rfd = "0.17"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "6"
memmap2 = "0.9"
tauri-winrt-notification = "0.8"
wry = "0.57"
tao = "0.37"

windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Registry"] }
